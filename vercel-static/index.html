<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="자람마을 아동복 성장순환 모바일 데모" />
    <title>자람마을 | 아동복 성장순환 데모</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="demo-stage">
      <section class="phone-shell" aria-label="자람마을 모바일 데모">
        <div class="phone-hardware" aria-hidden="true"><span></span></div>
        <div class="app-shell">
          <div id="screen" class="app-scroll"></div>
          <nav class="bottom-nav" aria-label="주요 메뉴">
            <button data-route="home">홈</button>
            <button data-route="waitlist">기다림</button>
            <button data-route="sell">등록</button>
            <button data-route="closet">옷장</button>
          </nav>
          <div id="toast" class="toast" role="status" aria-live="polite"></div>
        </div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
