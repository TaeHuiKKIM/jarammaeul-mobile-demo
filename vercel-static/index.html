<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="자람마을 아동복 성장순환 모바일 데모" />
    <title>자람마을 | 아동복 성장순환 데모</title>
    <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/TaeHuiKKIM/jarammaeul-mobile-demo/main/public/favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="demo-stage">
      <section class="phone-shell" aria-label="자람마을 모바일 데모">
        <div class="phone-hardware" aria-hidden="true"><span></span></div>
        <div class="app-shell">
          <div id="screen" class="app-scroll"></div>
          <nav class="bottom-nav" aria-label="주요 메뉴">
            <button data-route="home"><svg class="ui-icon" data-icon="home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>홈</span></button>
            <button data-route="waitlist"><svg class="ui-icon" data-icon="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span>기다림</span></button>
            <button data-route="sell"><svg class="ui-icon" data-icon="package-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16.5 9.4-9-5.2"/><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l3-1.7"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/><path d="M19 16v6M16 19h6"/></svg><span>등록</span></button>
            <button data-route="closet"><svg class="ui-icon" data-icon="shopping-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l1 13H5L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span>옷장</span></button>
          </nav>
          <div id="toast" class="toast" role="status" aria-live="polite"></div>
        </div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
